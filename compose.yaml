name: ${COMPOSE_PROJECT_NAME:-nexus}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus-local-only}
    ports:
      - "127.0.0.1:${NEXUS_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nexus-api:local
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus-local-only}@db:5432/${POSTGRES_DB:-nexus}
      NEXUS_ENVIRONMENT: ${NEXUS_ENVIRONMENT:-development}
      NEXUS_LOG_LEVEL: ${NEXUS_LOG_LEVEL:-INFO}
      NEXUS_CORS_ORIGINS: ${NEXUS_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      NEXUS_REQUIRE_ACTION_APPROVAL: ${NEXUS_REQUIRE_ACTION_APPROVAL:-true}
      NEXUS_SIMULATION_ONLY: ${NEXUS_SIMULATION_ONLY:-true}
      NEXUS_SEED_DEMO: ${NEXUS_SEED_DEMO:-true}
      NEXUS_SIMULATION_STEP_DELAY_SECONDS: ${NEXUS_SIMULATION_STEP_DELAY_SECONDS:-0.2}
      NEXUS_AUDIT_HMAC_KEY: ${NEXUS_AUDIT_HMAC_KEY:-replace-with-at-least-32-random-bytes}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEXUS_OPENAI_MODEL: ${NEXUS_OPENAI_MODEL:-gpt-5.6}
      NEXUS_OPENAI_TIMEOUT_SECONDS: ${NEXUS_OPENAI_TIMEOUT_SECONDS:-30}
    ports:
      - "127.0.0.1:${NEXUS_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - data
    stop_grace_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_WS_BASE_URL: ""
    image: nexus-web:local
    ports:
      - "127.0.0.1:${NEXUS_WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    stop_grace_period: 10s

volumes:
  postgres-data:

networks:
  edge:
  data:
    internal: true
