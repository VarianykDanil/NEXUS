name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install API and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e './backend[dev]'
      - name: Lint
        run: ruff check backend
      - name: Type-check
        run: mypy backend/src
      - name: Test
        run: pytest -q backend

  dashboard:
    name: React dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @nexus/dashboard lint
      - name: Type-check
        run: pnpm --filter @nexus/dashboard typecheck
      - name: Test
        run: pnpm --filter @nexus/dashboard test
      - name: Build
        run: pnpm --filter @nexus/dashboard build

  robotics-core:
    name: C++ navigation core (${{ matrix.compiler.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S robotics -B build/robotics -DNEXUS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/robotics --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/robotics --build-config Release --output-on-failure

  containers:
    name: Compose and container builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend
      - dashboard
      - robotics-core
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build core images
        run: docker compose build api web
      - name: Start core stack
        run: docker compose up --detach --wait --wait-timeout 120
      - name: Smoke-test routed endpoints
        run: |
          curl --fail --show-error --silent http://127.0.0.1:3000/healthz
          curl --fail --show-error --silent http://127.0.0.1:3000/api/v1/health
          curl --fail --show-error --silent http://127.0.0.1:3000/api/v1/ready
          curl --fail --show-error --silent http://127.0.0.1:3000/api/v1/projects
      - name: Show container diagnostics
        if: failure()
        run: docker compose ps --all && docker compose logs --no-color --tail=200
      - name: Stop core stack
        if: always()
        run: docker compose down --volumes --remove-orphans
